    <title>Secure Video Session</title>
    
    <script>
      // Workaround for fetch polyfill issues in sandboxed iframes
      if (typeof window !== 'undefined' && window.fetch) {
        const originalFetch = window.fetch;
        try {
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get() { return originalFetch; },
            set(v) { 
              console.warn('Blocked attempt to overwrite window.fetch');
            }
          });
        } catch (e) {
          // ignore
        }
      }
    </script>
